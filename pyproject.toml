[project]
name = "praxis-backend"
version = "0.1.0"
description = "Backend services and agent for Praxis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = ["botocore[crt]", "strands-agents>=1.0,<2"]

[project.scripts]
praxis = "praxis.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["boto3-stubs", "pyright", "pytest", "ruff"]

[tool.uv.build-backend]
module-name = "praxis"
module-root = "backend/src"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "N",
  "S",
  "C4",
  "DTZ",
  "LOG",
  "PIE",
  "PT",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "PERF",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["backend/src", "backend/tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["backend/tests"]
